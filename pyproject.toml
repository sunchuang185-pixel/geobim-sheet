[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geobim-sheet"
version = "0.3.0"
description = "Open-source GIS/BIM drawing workspace and mining/industrial design revision review agent (MCP + Web)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Flask>=3.1,<4",
    "ifcopenshell>=0.8.5,<1",
    "shapely>=2.1,<3",
    "pyproj>=3.6,<4",
    "reportlab>=4.0,<5",
    "ezdxf>=1.3,<2",
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pymupdf>=1.24",
]

[project.scripts]
geobim-sheet = "geobim_sheet.__main__:main"
geobim-sheet-mcp = "geobim_sheet.mcp_server:main"

[tool.setuptools.packages.find]
include = ["geobim_sheet*"]

[tool.setuptools.package-data]
geobim_sheet = ["static/*", "demo/*", "demo/review/*"]
